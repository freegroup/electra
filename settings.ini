DATADIR_BRAINS=data/brains
DATADIR_I18N=data/i18n

# Internal path prefix for the scope tree. Everything under this prefix is an
# application workspace. Derived paths:
#   apps      → ${SCOPE_PREFIX}/apps   (shared content root for all app backends)
#   users     → ${SCOPE_PREFIX}/users  (personal workspaces)
# The prefix is also stripped from all scope paths in REST responses so external
# callers (BFFs, browsers) only ever see relative paths like "apps/klasse8a".
SCOPE_PREFIX=electra/content

