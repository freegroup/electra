# Internal path prefix for the scope tree. Everything under this prefix is an
# application workspace. Derived paths:
#   apps      → ${SCOPE_PREFIX}/apps   (shared content root for all app backends)
#   users     → ${SCOPE_PREFIX}/users  (personal workspaces)
# The prefix is also stripped from all scope paths in REST responses so external
# callers (BFFs, browsers) only ever see relative paths like "apps/klasse8a".
SCOPE_PREFIX=electra/content

PORT_INGRESS=8080
PORT_PERMISSIONS=8081
PORT_HOME=8083
PORT_COMMON=8084
PORT_SIMULATOR=8085
PORT_SHAPES=8086
PORT_BRAINS=8087
PORT_USERINFO=8088
PORT_AUTHOR=8089
PORT_SHEETS=8090
PORT_DESIGNER=8091
PORT_DATABASE=8095
PORT_DB_ADMIN=8096
# Host, name, user and password of the database are per-environment and live in
# secrets.ini (dev: the project root, prod: ansible/secrets.ini). Only the values
# that are the same everywhere belong here - dotenv keeps the first value it
# sees, so a default here would shadow the real one.
PG_DATABASE_PORT=5432
PG_DATABASE_SCHEMA=docstore
LOCALHOST=127.0.0.1
SSL_KEY=/etc/letsencrypt/live/electra.academy/privkey.pem
SSL_CERT=/etc/letsencrypt/live/electra.academy/cert.pem

# Google sign-in. The client id is public (it is handed to the browser and is
# visible in the sign-in URL), so it belongs here and not in secrets.ini - what
# matters is that the INGRESS knows it, instead of believing whatever client id
# a login request claims. Must match the value in common/public/js/Userinfo.js.
# Manage the client at https://console.cloud.google.com/apis/credentials
GOOGLE_CLIENT_ID=941934804792-2cosu3n1jpm05jj5551i095hppugtuo2.apps.googleusercontent.com

# Signing in with this address grants the platform-wide "admin" role. Leave it
# empty and nobody gets it. Per-scope admin rights are membership data in the
# document store and are unrelated to this.
ADMIN_MAIL=openjacob@gmail.com
