- name: My first play
  hosts: electra

  tasks:

  - name: Delete old deployment
    file:
      state: absent
      path: /home/electra/server
      
  - name: Git checkout electra
    become: true
    become_user: electra
    ansible.builtin.git:
      repo: 'https://github.com/freegroup/electra.git'
      dest: /home/electra/server
      force: true
      update: true

  - name: Delete local "youtube" directory
    file:
      state: absent
      path: /home/electra/server/youtube

  - name: Delete local "ansible" directory
    file:
      state: absent
      path: /home/electra/server/ansible
    
  - name: Install packages in /author
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/author
    
  - name: Install packages in /brains
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/brains

  - name: Install packages in /simulator
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/simulator

  - name: Install packages in /common
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/common

  - name: Install packages in /designer
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/designer

  - name: Install packages in /book
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/book

  - name: Install packages in /home
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/home

  - name: Install packages in /ingress
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/ingress

  - name: Install packages in /permissions
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/permissions

  - name: Install packages in /shapes
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/shapes

  - name: Install packages in /sheets
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/sheets

  # Download Chromium into the project-local puppeteer cache (.puppeteerrc.cjs
  # pins cacheDirectory to /home/electra/server/sheets/.puppeteer-cache). Run as
  # the same user that runs the sheets process so the browser is found at
  # runtime. Needed for PDF export + preview screenshots. (puppeteer 19 ships
  # the downloader as install.js — there is no `npx puppeteer` CLI.)
  - name: Install Chromium for puppeteer (/sheets)
    become: true
    become_user: electra
    command: node node_modules/puppeteer/install.js
    args:
      chdir: /home/electra/server/sheets

  - name: Install packages in /database
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/database

  - name: Install packages in /userinfo
    become: true
    become_user: electra
    community.general.npm:
      path: /home/electra/server/userinfo

  - name: Build /home
    become: true
    become_user: electra
    command: npm run build
    args:
      chdir: /home/electra/server/home

  - name: Build /book
    become: true
    become_user: electra
    command: npm run build
    args:
      chdir: /home/electra/server/book

  - name: Build /author
    become: true
    become_user: electra
    command: npm run build
    args:
      chdir: /home/electra/server/author

  - name: Build /simulator
    become: true
    become_user: electra
    command: npm run build
    args:
      chdir: /home/electra/server/simulator

  - name: Build /designer
    become: true
    become_user: electra
    command: npm run build
    args:
      chdir: /home/electra/server/designer

  # The PRODUCTION secrets, not the dev ones from the project root. Both files
  # are git-ignored; this is the only one that ever reaches the server.
  - name: Copy secret file
    ansible.builtin.copy:
      src: secrets.ini
      dest: /home/electra/server/secrets.ini
      owner: electra
      group: ssl_group
      mode: '0600'

  - name: Check for running PM2 processes
    become: true
    become_user: electra
    command: pm2 jlist
    args:
      chdir: /home/electra/server/
    register: pm2_list
    ignore_errors: yes

  - name: Delete all running processes via PM2 if any exist
    become: true
    become_user: electra
    command: pm2 delete all
    args:
      chdir: /home/electra/server/
    when: pm2_list.stdout != '[]'  # Condition to check if the PM2 list is not empty
    ignore_errors: yes

  # startOrRestart, not restart: the task above just deleted every process, and
  # "pm2 restart <file>" only acts on processes pm2 already knows - it aborts with
  # "Process or Namespace not found". startOrRestart covers both cases, which also
  # matters because the delete above is ignore_errors and may leave things running.
  #
  # The file MUST keep the ".config.js" ending. pm2 decides purely by filename
  # whether something is an ecosystem file or a plain script; named
  # "ecosystem.production.js" it launched the config itself as a single node
  # process instead of the 12 services.
  - name: Run the application via PM2 ecosystem configuration
    become: true
    become_user: electra
    command: pm2 startOrRestart ./ecosystem.production.config.js
    args:
      chdir: /home/electra/server/
